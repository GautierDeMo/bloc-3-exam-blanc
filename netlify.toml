[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  # Skip the build when nothing changed in client/ (exit code 0 = skip)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# React Router: serve index.html for every route so /article/1 for example works on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
